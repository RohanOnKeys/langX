name: CI

on:
  push:
  pull_request:

jobs:
  repo-sanity:
    name: Repo sanity
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Compile Python sources
        # Syntax only: py_compile never imports, so this needs no HPX and no
        # _langx extension. The rayx/ snapshot is reference material and is
        # not compiled.
        run: python -m py_compile python/src/langx/*.py bench/*.py tests/unit/*.py tests/integration/*.py

      - name: Install dev test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run pure unit tests
        # tests/unit is import-light and never loads _langx. Integration tests
        # need HPX and are not run in this job.
        run: pytest tests/unit

      - name: Check local markdown links
        run: python bench/check_md_links.py
